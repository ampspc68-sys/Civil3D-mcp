name: Civil 3D 2026 plugin CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Civil3D-MCP-Plugin/**"
      - "package.json"
      - "scripts/sync-version.mjs"

jobs:
  plugin:
    # Needs a self-hosted Windows runner with licensed Civil 3D 2026 references
    # (labels: self-hosted, Windows, Civil3D-2026). Without one, the job would
    # stay queued forever, so it only runs when the repository variable
    # CIVIL3D_SELF_HOSTED_RUNNER is 'true' (Settings > Secrets and variables >
    # Actions > Variables). Otherwise it is skipped and does not block CI; build
    # and test the plugin locally with LOCAL_BUILD_AND_TEST.md.
    if: ${{ vars.CIVIL3D_SELF_HOSTED_RUNNER == 'true' }}
    runs-on: [self-hosted, Windows, Civil3D-2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm run version:check
      - name: Compile against licensed Civil 3D references
        shell: powershell
        run: dotnet build ./Civil3D-MCP-Plugin/Civil3DMcpPlugin.csproj -c Release /p:Civil3DReferencesPath="$env:CIVIL3D_REFERENCES_PATH"
      - name: Build Node runtime for live smoke
        if: ${{ vars.RUN_CIVIL3D_LIVE_SMOKE == 'true' }}
        run: npm run build
      - name: Validate production MCP client
        if: ${{ vars.RUN_CIVIL3D_LIVE_SMOKE == 'true' }}
        run: node ./scripts/live-mcp-client-smoke.mjs
      - name: Run opt-in disposable host smoke
        if: ${{ vars.RUN_CIVIL3D_LIVE_SMOKE == 'true' }}
        shell: powershell
        env:
          CIVIL3D_LIVE_SMOKE_CONFIRM: DISPOSABLE_DRAWING
        run: |
          $env:CIVIL3D_LIVE_SMOKE_QC_PATH = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'civil3d-mcp-live-qc.txt'
          node ./scripts/live-host-smoke.mjs
